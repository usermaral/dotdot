<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel desktop player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 14px 0; background: #2B8C8C; font-family: 'Pixelify Sans', sans-serif; color: #000000; display: flex; flex-direction: column; gap: 14px">
<div style="background: #C3C3C3; border: 2px solid; border-color: #FFFFFF #404040 #404040 #FFFFFF; padding: 3px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 30px; background: linear-gradient(90deg, #00087A, #1A7FD4); color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 8px; font-weight: 600; font-size: 15px">
<span>dotdot.exe — Night Drive</span>
<div style="display: flex; gap: 3px">
<button aria-label="Minimize" style="width: 24px; height: 22px; background: #C3C3C3; border: 2px solid; border-color: #FFFFFF #404040 #404040 #FFFFFF; font: 600 12px 'Pixelify Sans', sans-serif; padding: 0">_</button>
<button aria-label="Close" style="width: 24px; height: 22px; background: #C3C3C3; border: 2px solid; border-color: #FFFFFF #404040 #404040 #FFFFFF; font: 600 12px 'Pixelify Sans', sans-serif; padding: 0">x</button>
</div>
</div>
<div style="margin: 0 6px; background: #0A0F0A; border: 2px solid; border-color: #404040 #FFFFFF #FFFFFF #404040; padding: 10px; font-family: VT323, monospace; color: #7CFF6B; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 20px"><span>01:42</span><span>{{fx}}</span></div>
<div style="font-size: 26px; line-height: 1; white-space: nowrap; overflow: hidden">*** Night Drive - your_track.m4a ***</div>
<div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="160">
<div style="height: 9px; background: {{c.c}}"></div>
</sc-for>
</div>
</div>
<div style="margin: 0 6px; height: 16px; background: #FFFFFF; border: 2px solid; border-color: #404040 #FFFFFF #FFFFFF #404040; display: flex; gap: 2px; padding: 2px; box-sizing: border-box">
<div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div><div style="width: 9px; background: #00087A"></div>
</div>
<div style="width: 210px; height: 210px; margin: 4px auto; border-radius: 50%; background: #D9D9D9; border: 3px solid; border-color: #FFFFFF #404040 #404040 #FFFFFF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center">
<span></span><button style="height: 44px; padding: 0 8px; background: transparent; border: none; font: 600 15px 'Pixelify Sans', sans-serif">VOL+</button><span></span>
<button aria-label="Previous" style="width: 48px; height: 48px; background: transparent; border: none; font: 600 18px 'Pixelify Sans', sans-serif">|&lt;&lt;</button>
<button aria-label="Play" style="width: 72px; height: 72px; border-radius: 50%; background: #C3C3C3; border: 3px solid; border-color: #FFFFFF #404040 #404040 #FFFFFF; font: 600 22px 'Pixelify Sans', sans-serif">&gt;</button>
<button aria-label="Next" style="width: 48px; height: 48px; background: transparent; border: none; font: 600 18px 'Pixelify Sans', sans-serif">&gt;&gt;|</button>
<span></span><button style="height: 44px; padding: 0 8px; background: transparent; border: none; font: 600 15px 'Pixelify Sans', sans-serif">VOL-</button><span></span>
</div>
<div style="margin: 0 6px 6px; border: 2px solid; border-color: #808080 #FFFFFF #FFFFFF #808080; padding: 12px 10px 8px; position: relative">
<span style="position: absolute; top: -11px; left: 10px; background: #C3C3C3; padding: 0 4px; font-size: 14px">Sound effects</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="6">
<button onClick="{{p.pick}}" style="height: 44px; display: flex; align-items: center; gap: 8px; background: transparent; border: none; font: 15px 'Pixelify Sans', sans-serif; text-align: left; padding: 0">
<span style="width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; border: 2px solid; border-color: #404040 #FFFFFF #FFFFFF #404040; display: grid; place-items: center"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{p.dot}}"></span></span>{{p.label}}</button>
</sc-for>
</div>
</div>
<div style="height: 24px; margin: 0 2px 2px; display: flex; gap: 3px; font-size: 13px">
<div style="flex: 1; border: 1px solid; border-color: #808080 #FFFFFF #FFFFFF #808080; padding: 2px 6px">Playing · 3 of 12</div>
<div style="width: 90px; border: 1px solid; border-color: #808080 #FFFFFF #FFFFFF #808080; padding: 2px 6px">320 kbps</div>
</div>
</div>
<div style="margin-top: auto; height: 46px; margin-left: -14px; margin-right: -14px; background: #C3C3C3; border-top: 2px solid #FFFFFF; display: flex; align-items: center; padding: 0 6px; gap: 6px">
<button style="height: 36px; padding: 0 12px; background: #C3C3C3; border: 2px solid; border-color: #FFFFFF #404040 #404040 #FFFFFF; font: 600 15px 'Pixelify Sans', sans-serif">dotdot</button>
<div style="flex: 1; height: 32px; border: 2px solid; border-color: #404040 #FFFFFF #FFFFFF #404040; display: flex; align-items: center; padding: 0 8px; font-size: 14px; background: #D4D4D4">Night Drive</div>
<div style="height: 32px; border: 1px solid; border-color: #808080 #FFFFFF #FFFFFF #808080; display: flex; align-items: center; padding: 0 8px; font-size: 14px">3:09 PM</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() { this.timer = setInterval(() => this.setState({ t: (this.state.t || 0) + 1 }), 100); }
componentWillUnmount() { clearInterval(this.timer); }
renderVals() {
const t = (this.state.t || 0) * 0.1;
const fx = this.state.fx || 'Slowed';
const cols = 16, rows = 10, cells = [];
const h = Array.from({ length: cols }, (_, i) => Math.max(1, Math.round(rows * (0.25 + 0.75 * Math.abs(Math.sin(t * (1.4 + i * 0.19) + i * 0.9))) * (1 - i * 0.03))));
for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
const lvl = rows - y, on = lvl <= h[x];
cells.push({ c: on ? (lvl > 8 ? '#FF5A4A' : lvl > 6 ? '#FFD84A' : '#7CFF6B') : '#16261A' });
}
const presets = ['Slowed', 'Tape', 'Vinyl', 'Sped up', '8D', 'Reverb'].map(l => ({ label: l, dot: l === fx ? '#000000' : 'transparent', pick: () => this.setState({ fx: l }) }));
return { cells, presets, fx: fx.toUpperCase() };
}
}
</script>
</body>
</html>
