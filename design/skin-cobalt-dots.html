<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cobalt dot-matrix player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 22px 28px; background: #FFFFFF; color: #1E36C8; font-family: 'Space Mono', monospace; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1E36C8" stroke-width="1.4" aria-hidden="true" style="position: absolute; right: 26px; top: 112px; transform: rotate(12deg)"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.6z"/></svg>
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1E36C8" stroke-width="1.4" aria-hidden="true" style="position: absolute; left: 20px; top: 440px; transform: rotate(-14deg)"><path d="M12 21s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: Yellowtail, cursive; font-size: 36px; line-height: 1">dotdot</span>
<span style="font-size: 12px; font-weight: 700; border: 1.5px solid #1E36C8; border-radius: 999px; padding: 4px 10px">NOW PLAYING</span>
</div>
<div style="align-self: center; width: 300px; height: 300px; border-radius: 22px; background: #EEF1FF; display: grid; grid-template-columns: repeat(22, minmax(0, 1fr)); padding: 7px; box-sizing: border-box; transform: rotate(-1.5deg)">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="484">
<div style="display: grid; place-items: center; width: 13px; height: 13px"><div style="width: {{d.w}}px; height: {{d.w}}px; border-radius: 50%; background: #1E36C8"></div></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 24px; font-weight: 700">Night Drive</span>
<span style="font-size: 13px; color: #3F55D6">your_track.m4a · {{fx}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 10px; border: 1.5px solid #1E36C8; border-radius: 999px; overflow: hidden"><div style="width: 42%; height: 100%; background: #1E36C8"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px"><span>01:42</span><span>-02:31</span></div>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 22px">
<button aria-label="Previous" style="width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid #1E36C8; background: #FFFFFF; color: #1E36C8; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 5L9 12l10 7V5z"/><path d="M5 5v14"/></svg></button>
<button aria-label="Play" style="width: 84px; height: 84px; border-radius: 50%; border: none; background: #1E36C8; color: #FFFFFF; display: grid; place-items: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 4l13 8-13 8V4z"/></svg></button>
<button aria-label="Next" style="width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid #1E36C8; background: #FFFFFF; color: #1E36C8; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 5l10 7-10 7V5z"/><path d="M19 5v14"/></svg></button>
</div>
<div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<button onClick="{{p.pick}}" style="height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #1E36C8; background: {{p.bg}}; color: {{p.fg}}; font: 700 12px 'Space Mono', monospace; transform: rotate({{p.rot}}deg)">{{p.label}}</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() { this.timer = setInterval(() => this.setState({ t: (this.state.t || 0) + 1 }), 90); }
componentWillUnmount() { clearInterval(this.timer); }
renderVals() {
const t = (this.state.t || 0) * 0.09;
const fx = this.state.fx || 'SLOWED';
const bass = 0.55 + 0.45 * Math.abs(Math.sin(t * 2.2)) * (0.7 + 0.3 * Math.sin(t * 0.7));
const n = 22, c = (n - 1) / 2, dots = [];
for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
const dx = (x - c) / c, dy = (y - c) / c, d = Math.sqrt(dx * dx + dy * dy);
const ring = Math.max(0, 1 - Math.abs(d - bass * 0.75) * 3.2);
const core = Math.max(0, 1 - d / (0.35 * bass));
const spark = ((x * 7 + y * 13 + Math.floor(t * 6)) % 23 === 0) ? 0.6 : 0;
const v = Math.min(1, Math.max(ring, core) + spark);
dots.push({ w: Math.round(1.5 + v * 10) });
}
const names = ['SLOWED', 'TAPE', 'VINYL', 'SPED UP', '8D'];
const rots = [-3, 2, -1, 3, -2];
const presets = names.map((l, i) => ({ label: l, rot: rots[i], bg: l === fx ? '#1E36C8' : '#FFFFFF', fg: l === fx ? '#FFFFFF' : '#1E36C8', pick: () => this.setState({ fx: l }) }));
return { dots, presets, fx };
}
}
</script>
</body>
</html>
